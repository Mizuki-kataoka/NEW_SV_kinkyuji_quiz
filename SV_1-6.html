<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SV緊急時対応クイズ</title>
  <link rel="stylesheet" href="SV_kinkyu1.css">
</head>
<body>
  <div class="container">
    <h1>SV緊急時対応クイズ</h1>
    <h2>地震編【難】（全11問）</h2>

    <!-- 名前入力 -->
    <label>
      名前：
      <input id="username" type="text" placeholder="ニックネーム（20文字以内）" maxlength="20">
    </label>

    <!-- クイズ出題エリア -->
    <div id="quiz"></div>

    <!-- 回答ボタン -->
    <button id="submit">回答を送信</button>

    <!-- 結果 -->
    <div id="result"></div>

    <!-- ランキング -->
    <h2>ランキング</h2>
    <ol id="ranking"></ol>
    <button id="resetRanking">ランキングをリセット</button>
  </div>

  <script>
  //―――― 問題データ（入力式用に修正） ――――
  const questions = [
    { q: '【地震】地震が発生している場合の対応の流れは？', answer: ['お客様に対して身を守る行動を呼びかけ、揺れが収まるまで店内待機'] },
    { q: '【地震】震度何以上が対応を変更する基準になるか？', answer: ['震度5強'] },
    { q: '【地震】震度5強以上の場合、揺れが収まった後の対応の流れは？', answer: ['広域避難所へ避難する'] },
    { q: '【地震】避難場所に避難した後の対応の流れ①は？', answer: ['00000JapanのWi-fiに接続する'] },
    { q: '【地震】避難場所に避難した後の対応の流れ②は？', answer: ['店舗LINEで西脇社員・綱井社員をメンションし報告'] },
    { q: '【地震】避難場所に避難した後の対応の流れ③は？', answer: ['自治体・警察・消防・社員等の指示に従う'] },
    { q: '【地震】①どの社員に報告するか？', answer: ['西脇社員','綱井社員'] },
    { q: '【地震】②何を報告するか？（複数可）', answer: ['所属店舗名','氏名フルネーム','負傷者の発生有無と詳細','店舗の被害状況','自分の避難先'] },
    { q: '【地震】震度5未満の場合の対応の流れは？', answer: ['人的被害や店舗に重大な被害があるか確認'] },
    { q: '【地震】人的被害や店舗に重大な被害がある場合の対応の流れは？', answer: ['店舗LINEで西脇社員・綱井社員をメンションし報告'] },
    { q: '【地震】人的被害や店舗に重大な被害がない場合の対応の流れは？', answer: ['安全等を確認し営業再開'] }
  ];

  //―――― 状態 ――――
  let current = 0;
  let score   = 0;
  let history = [];

  //―――― DOM取得 ――――
  const username  = document.getElementById('username');
  const quizEl    = document.getElementById('quiz');
  const submitBtn = document.getElementById('submit');
  const resultEl  = document.getElementById('result');
  const rankEl    = document.getElementById('ranking');
  const resetBtn  = document.getElementById('resetRanking');

  //―――― 初期化 ――――
  submitBtn.disabled = true;
  renderQuestion();
  renderRanking(JSON.parse(localStorage.getItem('quizRanking_input')||'[]'));

  username.addEventListener('input', () => {
    submitBtn.disabled = !username.value.trim();
  });

  submitBtn.addEventListener('click', () => {
    const name = username.value.trim();
    if (!name) return alert('名前を入力してください');

    const input = document.getElementById('answerInput').value.trim();
    if (!input) return alert('答えを入力してください');

    const { q, answer } = questions[current];
    // 正解判定（大文字小文字を無視）
    const isCorrect = answer.some(a => input.toLowerCase() === a.toLowerCase());
    if (isCorrect) score++;

    history.push({ q, answer, selected: input, isCorrect });

    const cls = isCorrect ? 'correct' : 'wrong';
    quizEl.classList.add(cls);
    quizEl.addEventListener('animationend', () => {
      quizEl.classList.remove(cls);
      current < questions.length ? renderQuestion() : finishQuiz();
    }, { once: true });
    current++;
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('ランキングを本当にリセットしますか？')) {
      localStorage.removeItem('quizRanking_input');
      renderRanking([]);
    }
  });

  //―――― 問題描画 ――――
  function renderQuestion() {
    const { q } = questions[current];
    let html = `<p>${current+1}. ${q}</p>`;
    html += `<input type="text" id="answerInput" placeholder="ここに答えを入力">`;
    quizEl.innerHTML = html;
  }

  //―――― 終了処理 ――――
  function finishQuiz() {
    const name = username.value.trim();
    let html = `<p>${name} さんの点数：<strong>${score}</strong> / ${questions.length}</p>`;

    html += '<h3>回答結果一覧</h3><ol>';
    history.forEach((e, idx) => {
      const { q, answer, selected, isCorrect } = e;
      const items = answer.map(txt => {
        let mark = selected.toLowerCase() === txt.toLowerCase() ? '✅' : '✔';
        return `<li style="list-style:none;">${mark} ${txt}</li>`;
      }).join('');
      html += `
        <li>
          <strong>Q${idx+1}:</strong> ${q}
          <ul>${items}</ul>
          <div style="color:${isCorrect?'green':'red'};">${isCorrect?'正解':'不正解'}（あなたの回答: ${selected}）</div>
        </li>`;
    });
    html += '</ol>';

    function getComment(score, total) {
      if      (score === total) return '🤩 完璧すぎる！SVシートで最終確認をしましょう！';
      else if (score >= 8)      return '🥸 及第点。SVシートをちゃんと覚えましょう！';
      else if (score >= 5)      return '🤯 こんなクイズもできなかったら本当のSVには何も言えないことでしょう';
      else                      return '💀 今すぐSVシートをくまなく見て覚えてください';
    }
    const comment = getComment(score, questions.length);
    html += `<p class="comment">${comment}</p>`;

    resultEl.innerHTML = html;
    updateRanking(name, score);
  }

  //―――― ランキング更新 ――――
  function updateRanking(name, score) {
    const key = 'quizRanking_input';
    const data = JSON.parse(localStorage.getItem(key) || '[]');
    const now = new Date().toLocaleString();
    const ex = data.find(x=>x.name===name);
    if (ex) { if (score>ex.score) {ex.score = score; ex.date = now;} }
    else    { data.push({name,score, date: now}); }
    data.sort((a,b)=>b.score-a.score);
    localStorage.setItem(key, JSON.stringify(data));
    renderRanking(data, name, score);
  }

  //―――― ランキング描画 ――――
  function renderRanking(data, curName, curScore) {
    let html = '', prev = null, rank=0;
    data.forEach((x,i)=>{
      if (x.score !== prev) { rank = i+1; prev = x.score; }
      if (rank>10) return;
      const cls = x.name===curName&&x.score===curScore? ' class="highlight"' : '';
      html += `<li${cls}>${rank}位：${x.name}（
